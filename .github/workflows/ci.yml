name: CI

on:
  push:
    branches: ["main", "master", "copilot/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/

      - name: Check formatting with Black
        run: black --check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # Supply-chain security scan: audit the pinned dependencies for known CVEs.
  # It scans every requirements*.txt file — requirements-lock.txt (the hash-
  # pinned runtime tree that Dockerfile.heroforge-app installs with
  # --require-hashes, so the exact shipped versions are checked) plus the
  # requirements-pip*.txt CI tooling pins themselves. Kept as its own job so a
  # dependency CVE is reported independently of the lint/format/test results.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      # Pin pip itself to a verified, hash-checked version first (so the tool
      # doing the auditing is reproducible), then install pip-audit from its own
      # hash-pinned lockfile. Both installs are --require-hashes; the pinned pip
      # already satisfies pip-audit's own pip requirement, so the second install
      # needs no hash for pip. Regenerate requirements-pip-audit.txt with:
      #   pip-compile --generate-hashes --no-emit-index-url \
      #       --output-file requirements-pip-audit.txt requirements-pip-audit.in
      - name: Install pinned pip and pip-audit
        run: |
          python -m pip install --require-hashes -r requirements-pip.txt \
            && python -m pip install --require-hashes -r requirements-pip-audit.txt

      - name: Audit all pinned requirements for known CVEs
        run: |
          for req in requirements*.txt; do
            echo "::group::pip-audit ${req}"
            pip-audit -r "${req}"
            echo "::endgroup::"
          done
