name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (including ruff and black)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install graphify (codebase knowledge graph for AI assistants)
        run: pip install graphifyy

      - name: Pre-build the graphify knowledge graph
        # Maps the codebase into graphify-out/graph.json (local AST extraction, no
        # API key needed) so Copilot can query the graph instead of reading many
        # files, reducing token cost. The graphify skill rebuilds it if missing.
        run: graphify update .
