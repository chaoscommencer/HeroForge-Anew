[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heroforge"
version = "8.0.0"
description = "HeroForge Anew – D&D 3.5 character builder (Python/PyQt6 edition)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-openpyxl>=3.1",
]

[project.scripts]
heroforge = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N"]
ignore = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["heroforge"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
